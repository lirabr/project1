[project]
name = "trading-desk"
version = "0.3.0"
description = "Trading desk: research lab, paper desk, memory, risk gate, optional LangGraph"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "yfinance>=0.2.40",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "joblib>=1.4",
  "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]
tracking = ["mlflow>=2.16"]
graph = ["langgraph>=0.2.60", "langgraph-checkpoint-sqlite>=2.0"]

[project.scripts]
desk-research = "desk.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
exclude-newer = "2026-09-15T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
